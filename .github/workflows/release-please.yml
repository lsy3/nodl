---
name: Release Please

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    name: Release versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python3 -m unittest discover -s tools/tests -q
      - run: python3 tools/check_release_versions.py .

  release-please:
    name: Prepare release PR / tag
    needs: versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Optional RELEASE_PLEASE_TOKEN: a PAT owned by a repository writer.
          # Fine-grained permissions: Contents, Issues, and Pull requests: write.
          # A classic PAT needs public_repo for this public repository.
          # Authorize organization SSO if required by the organization.
          # Without it, GITHUB_TOKEN can create PRs/tags/releases, but those
          # events do not trigger CI. See RELEASING.md before merging a release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # UNTESTED BLOOM EXAMPLE ONLY: leave commented until a maintainer validates it.
