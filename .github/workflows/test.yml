---
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    # mcap-ros2-support is a pip rosdep; PEP 668 (Python >=3.11) blocks rosdep's
    # global pip install without this. humble (jammy) is unaffected.
    env:
      PIP_BREAK_SYSTEM_PACKAGES: 1
    strategy:
      fail-fast: false
      matrix:
        # One job per distro — RMW variation is handled inside the job.
        # nodl_observe is ament_cmake (C++): a missing rosgraph_msgs/Node.msg is a
        # BUILD failure (loud), not a silent test-skip, so requires_node_msg is gone.
        ros: [humble, jazzy, kilted, lyrical, rolling]
        # ubuntu is mapped per distro; add a distro by extending both lists.
        include:
          - ros: humble
            ubuntu: jammy
          - ros: jazzy
            ubuntu: noble
          - ros: kilted
            ubuntu: noble
          - ros: lyrical
            ubuntu: resolute
          - ros: rolling
            ubuntu: resolute
    container:
      image: rostooling/setup-ros-docker:ubuntu-${{ matrix.ubuntu }}-latest
    steps:
      - name: Install RMW implementations
        # Installed upfront so the integration-test loop below can switch
        # RMW_IMPLEMENTATION without touching apt again.  apt package name = RMW
        # impl name with underscores → hyphens (rmw_zenoh_cpp →
        # ros-<distro>-rmw-zenoh-cpp).  rmw_zenoh_cpp is not packaged for humble,
        # so it is installed (and tested) only on Iron+.
        run: |
          apt-get update
          rmws="rmw_fastrtps_cpp rmw_cyclonedds_cpp"
          if [ "${{ matrix.ros }}" != "humble" ]; then
            rmws="$rmws rmw_zenoh_cpp"
          fi
          for rmw in $rmws; do
            apt-get install -y --no-install-recommends \
              "ros-${{ matrix.ros }}-$(echo "$rmw" | tr '_' '-')"
          done

      # Removed the ros2-testing rosgraph_msgs bridge step to test whether the
      # main-index package now ships Node.msg; restore per-distro if a build fails.

      - name: Build and run unit tests (default RMW)
        # Builds + runs all tests once. The integration test is registered per RMW
        # (call_for_each_rmw_implementation, CMakeLists.txt), so this covers
        # fastrtps + cyclonedds; only zenoh needs the router leg below.
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: ament_nodl nodl nodl_observe nodl_schema ros2nodl test_ament_nodl
          target-ros2-distro: ${{ matrix.ros }}

      # zenoh needs its own leg: it requires a running router (rmw_zenohd) that
      # the CMake macro doesn't start. Re-run only the zenoh ctest with it up.
      - name: Integration test — rmw_zenoh_cpp (needs router)
        # rmw_zenoh_cpp is not packaged for humble; skip that leg there.
        if: matrix.ros != 'humble'
        env:
          ROS_DOMAIN_ID: 12
        run: |
          pkill -f ros2 || true
          . ros_ws/install/setup.sh
          ros2 daemon stop || true
          # rmw_zenoh_cpp needs its router running for cross-process discovery
          # (the scenario nodes and the observe binary are separate processes).
          # Invoke the binary directly: `ros2 run` (the ros2run package) is NOT
          # installed in the CI image, so `ros2 run rmw_zenoh_cpp rmw_zenohd`
          # errors with "invalid choice: 'run'".
          zenohd=$(find "/opt/ros/${{ matrix.ros }}" -name rmw_zenohd -type f | head -1)
          "$zenohd" & zenohd_pid=$!
          sleep 8
          colcon test --build-base ros_ws/build --install-base ros_ws/install \
            --packages-select nodl_observe \
            --ctest-args -R test_observe_integration__rmw_zenoh_cpp \
            --event-handlers console_cohesion+
          kill "$zenohd_pid" 2>/dev/null || true
          colcon test-result --test-result-base ros_ws/build --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Artifact key uses distro only — no RMW axis in the matrix any more.
          name: colcon-logs-${{ matrix.ros }}
          path: ros_ws/log
