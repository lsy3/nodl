---
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per distro — RMW variation is handled inside the job.
        # nodl_observe is ament_cmake (C++): a missing rosgraph_msgs/Node.msg is a
        # BUILD failure (loud), not a silent test-skip, so requires_node_msg is gone.
        ros: [humble, jazzy, kilted, lyrical, rolling]
        # ubuntu is mapped per distro; add a distro by extending both lists.
        include:
          - ros: humble
            ubuntu: jammy
          - ros: jazzy
            ubuntu: noble
          - ros: kilted
            ubuntu: noble
          - ros: lyrical
            ubuntu: resolute
          - ros: rolling
            ubuntu: resolute
    container:
      image: rostooling/setup-ros-docker:ubuntu-${{ matrix.ubuntu }}-latest
    steps:
      - name: Install RMW implementations
        # Installed upfront so the integration-test loop below can switch
        # RMW_IMPLEMENTATION without touching apt again.  apt package name = RMW
        # impl name with underscores → hyphens (rmw_zenoh_cpp →
        # ros-<distro>-rmw-zenoh-cpp).  rmw_zenoh_cpp is not packaged for humble,
        # so it is installed (and tested) only on Iron+.
        run: |
          apt-get update
          rmws="rmw_fastrtps_cpp rmw_cyclonedds_cpp"
          if [ "${{ matrix.ros }}" != "humble" ]; then
            rmws="$rmws rmw_zenoh_cpp"
          fi
          for rmw in $rmws; do
            apt-get install -y --no-install-recommends \
              "ros-${{ matrix.ros }}-$(echo "$rmw" | tr '_' '-')"
          done

      - name: Prefer a rosgraph_msgs that ships Node.msg (best-effort bridge)
        # Node.msg has not yet reached the main index on humble/jazzy/kilted (it
        # arrived via ros2-testing ahead of the release).  Install that package
        # from ros2-testing and `apt-mark hold` it so action-ros-ci's rosdep
        # can't pull the main-index version back: the C++ build needs Node.msg at
        # COMPILE time, so a plain `install` (not `--only-upgrade`, which no-ops
        # when the package isn't pre-installed, e.g. on the humble image) is
        # required.  A missing Node.msg then surfaces as a loud build error.
        if: matrix.ros == 'humble' || matrix.ros == 'jazzy' || matrix.ros == 'kilted'
        continue-on-error: true
        run: |
          # Reuse the ROS apt keyring already in the container (named
          # ros-archive-keyring.gpg or ros2-archive-keyring.gpg depending on age);
          # fall back to [trusted=yes] for the official ros2-testing repo if none
          # is found, rather than silently skipping (the previous bug).
          key=$(ls /usr/share/keyrings/ros*archive-keyring.gpg 2>/dev/null | head -1) || true
          if [ -n "$key" ]; then
            opt="[signed-by=$key]"
          else
            opt="[trusted=yes]"
          fi
          echo "deb $opt http://packages.ros.org/ros2-testing/ubuntu ${{ matrix.ubuntu }} main" \
            > /etc/apt/sources.list.d/ros2-testing.list
          apt-get update
          apt-get install -y "ros-${{ matrix.ros }}-rosgraph-msgs"
          apt-mark hold "ros-${{ matrix.ros }}-rosgraph-msgs"
          rm -f /etc/apt/sources.list.d/ros2-testing.list
          apt-get update || true

      - name: Install mcap (Python) for the integration-test fixtures
        # The integration test compares the observed Node against committed MCAP
        # fixtures via the `mcap` lib and skips (importorskip) when it is absent —
        # so it MUST be installed here or the comparison silently never runs.
        # jammy's pip predates PEP 668 and rejects --break-system-packages, so
        # fall back to a plain install there.
        run: pip3 install --break-system-packages mcap || pip3 install mcap

      - name: Build and run unit tests (default RMW)
        # action-ros-ci builds the workspace and runs ALL tests once (including
        # the RMW-agnostic gtest unit tests).  The default RMW (fastrtps) is used
        # here; the integration test is re-run per RMW in the steps below.
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: ament_nodl nodl nodl_observe nodl_schema ros2nodl test_ament_nodl
          target-ros2-distro: ${{ matrix.ros }}

      # Re-run only the RMW-sensitive integration test against the already-built
      # install space for each RMW.  A fresh ROS_DOMAIN_ID prevents leftover
      # discovery state from bleeding between runs; the daemon is stopped before
      # each leg for the same reason.
      - name: Integration test — rmw_fastrtps_cpp
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
          ROS_DOMAIN_ID: 10
        run: |
          pkill -f ros2 || true
          . ros_ws/install/setup.sh
          ros2 daemon stop || true
          colcon test --build-base ros_ws/build --install-base ros_ws/install \
            --packages-select nodl_observe \
            --ctest-args -R test_observe_integration \
            --event-handlers console_cohesion+
          colcon test-result --test-result-base ros_ws/build --verbose

      - name: Integration test — rmw_cyclonedds_cpp
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
          ROS_DOMAIN_ID: 11
        run: |
          pkill -f ros2 || true
          . ros_ws/install/setup.sh
          ros2 daemon stop || true
          colcon test --build-base ros_ws/build --install-base ros_ws/install \
            --packages-select nodl_observe \
            --ctest-args -R test_observe_integration \
            --event-handlers console_cohesion+
          colcon test-result --test-result-base ros_ws/build --verbose

      - name: Integration test — rmw_zenoh_cpp
        # rmw_zenoh_cpp is not packaged for humble; skip that leg there.
        if: matrix.ros != 'humble'
        env:
          RMW_IMPLEMENTATION: rmw_zenoh_cpp
          ROS_DOMAIN_ID: 12
        run: |
          pkill -f ros2 || true
          . ros_ws/install/setup.sh
          ros2 daemon stop || true
          # rmw_zenoh_cpp needs its router running for cross-process discovery
          # (the scenario nodes and the observe binary are separate processes).
          # Invoke the binary directly: `ros2 run` (the ros2run package) is NOT
          # installed in the CI image, so `ros2 run rmw_zenoh_cpp rmw_zenohd`
          # errors with "invalid choice: 'run'".
          zenohd=$(find "/opt/ros/${{ matrix.ros }}" -name rmw_zenohd -type f | head -1)
          "$zenohd" & zenohd_pid=$!
          sleep 8
          colcon test --build-base ros_ws/build --install-base ros_ws/install \
            --packages-select nodl_observe \
            --ctest-args -R test_observe_integration \
            --event-handlers console_cohesion+
          kill "$zenohd_pid" 2>/dev/null || true
          colcon test-result --test-result-base ros_ws/build --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Artifact key uses distro only — no RMW axis in the matrix any more.
          name: colcon-logs-${{ matrix.ros }}
          path: ros_ws/log
